social:
  github: https://github.com/YumengmengPC || github || "#191717"
  email: mailto:yumengmeng1026@gmail.com || envelope || "#55acd5"

waline:
  enable: true # 是否启用
  serverURL: "https://comment.yumengmeng.cn" # waline 服务端地址(自定义域名,Vercel 部署)
  lang: "zh-CN" # 评论界面语言
  locale:
    noRss: true # 隐藏 RSS 订阅入口(订阅本文评论/订阅本站评论):浏览器无内置 RSS 阅读器,点击会直接显示 XML 源码
  emoji: # 表情包合集(移除 weibo/alus;保留 qq 即 QQ 表情,虽为 gif 动图但用户指定保留)
    - https://unpkg.com/@waline/emojis@1.0.1/bilibili
    - https://unpkg.com/@waline/emojis@1.0.1/qq
    - https://unpkg.com/@waline/emojis@1.0.1/tieba
    - https://unpkg.com/@waline/emojis@1.0.1/tw-emoji
  meta: # 评论可以填写的项目
    - nick
    - mail
    - link
  requiredMeta: # 评论必须填写的项目
    - nick
    - mail
  wordLimit: 0 # 评论字数上限 (不建议为 0)
  pageSize: 10 # 每页显示评论条数
  pageview: true # 页面浏览量显示，服务端地址 https://comment.yumengmeng.cn

footer:
 since: 2026
 powered: true
 count: true

# 关闭 Google Fonts 远程加载,改用系统字体栈(-apple-system/PingFang SC),
# 消除国内慢依赖与 FOUT,视觉更贴近苹果原生。Mulish 等家族名保留但不加载,浏览器回退系统字体。
